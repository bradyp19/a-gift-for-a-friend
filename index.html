<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="a little encouragement, until we're together again.">
  <title>a gift for a friend</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script type="module" src="app.mjs?v=3"></script>
</head>
<body>
  <main>
    <section id="loading" class="screen loading" aria-label="Loading your little surprise">
      <div class="loader"><span id="loading-label" class="pixel-label" aria-label="Loading"></span><div class="loading-track"><div class="loading-fill"></div></div><p>a little something for you</p></div>
    </section>
    <section id="intro" class="screen intro" hidden aria-label="A note for Angie">
      <p class="eyebrow">a little reminder</p>
      <h1><span id="typed" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span><span class="sr-only">hey angie. you got this. keep grinding. you're almost there until thanksgiving. this is a timer until you see me again.</span></h1>
      <span class="intro-signature">for you, always.</span>
    </section>
    <section id="countdown" class="screen countdown" hidden aria-labelledby="timer-heading">
      <p id="arrival-status" class="sr-only" role="status"></p>
      <header><h2 id="timer-heading">until i see you again.</h2></header>
      <div class="scene">
        <figure class="drink"><div id="drink-art" role="img" aria-label="Pixel art mango HEYTEA boba"></div></figure>
        <div class="time-wrap"><div id="digits" class="digits" role="timer" aria-live="off"></div><p class="target-date">wednesday, november 18 <span>·</span> 8 pm eastern</p></div>
        <figure class="dog"><div id="dog-art" role="img" aria-label="A smiling pixel corgi wagging its tail and silently barking"></div></figure>
      </div>
      
    </section>
    <noscript><p class="no-script">hey angie. you got this. see you november 18 at 8 pm eastern. ♡<br>Enable JavaScript to see the countdown.</p></noscript>
  </main>
</body>
</html>
